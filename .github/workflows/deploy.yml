name: Compiler le site statique (branche deploy/production)

# Le site est un export statique (next.config.ts : output "export").
# Ce workflow compile out/ et le publie, seul, sur la branche deploy/production.
# GitHub Pages sert cette branche telle quelle : Settings → Pages →
# « Deploy from a branch », branche deploy/production, dossier / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Les variables publiques sont figées dans le bundle au build.
      # Changer de projet Supabase demande un nouveau build, pas une variable modifiée dans une console.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GIPHY_KEY: ${{ secrets.NEXT_PUBLIC_GIPHY_KEY }}
      - name: Publier out/ sur deploy/production
        working-directory: out
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Sans .nojekyll, Pages passerait le site dans Jekyll, qui ignore le dossier _next/.
          touch .nojekyll
          test -f CNAME
          git init -q -b deploy/production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site statique compilé depuis ${SOURCE_SHA}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # Branche de sortie uniquement : un seul commit, réécrit à chaque déploiement.
          git push -f origin deploy/production
