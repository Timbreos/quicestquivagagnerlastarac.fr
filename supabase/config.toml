# Configuration minimale de la CLI Supabase pour le développement local.
# `supabase start` puis `supabase db reset` applique migrations/ et seed.sql.
project_id = "quicestquivagagnerlastarac"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "https://quicestquivagagnerlastarac.fr/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

# Même gabarit pour le lien magique et la première connexion (signInWithOtp crée le compte).
[auth.email.template.magic_link]
subject = "Ton entrée pour la Starac"
content_path = "./templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Ton entrée pour la Starac"
content_path = "./templates/magic_link.html"

[storage]
enabled = true
file_size_limit = "3MiB"

[realtime]
enabled = true
