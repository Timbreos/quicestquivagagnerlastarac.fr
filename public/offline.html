<head>

<title>Hors ligne</title>
<style>

  <div class="card">
    <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><path d="M20 3 L24.5 13.9 L36.2 14.8 L27.2 22.4 L30 33.8 L20 27.6 L10 33.8 L12.8 22.4 L3.8 14.8 L15.5 13.9 Z" fill="#F0B93B"/></svg>
